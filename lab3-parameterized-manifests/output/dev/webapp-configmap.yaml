apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config-dev
  labels:
    app: webapp
    environment: dev
data:
  app.properties: |
    environment=dev
    log.level=debug
    database.host=dev-database.example.com
    database.port=5432
    cache.enabled=false
    debug.enabled=true
  nginx.conf: |
    server {
        listen 8080;
        server_name localhost;
        
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
