apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: webapp-dev

namespace: webapp-dev

resources:
- ../../base
- configmap.yaml

patchesStrategicMerge:
- deployment-patch.yaml

namePrefix: dev-

commonLabels:
  environment: development
  tier: dev

commonAnnotations:
  environment: "development"
  maintainer: "dev-team@company.com"
