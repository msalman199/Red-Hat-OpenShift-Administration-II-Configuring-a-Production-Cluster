apiVersion: v1
kind: LimitRange
metadata:
  name: dev-team-limits
  namespace: dev-team-alpha
spec:
  limits:
  # Container limits
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 1000m
      memory: 2Gi
    min:
      cpu: 50m
      memory: 64Mi
  
  # Pod limits
  - type: Pod
    max:
      cpu: 2000m
      memory: 4Gi
    min:
      cpu: 100m
      memory: 128Mi
  
  # Persistent Volume Claim limits
  - type: PersistentVolumeClaim
    max:
      storage: 10Gi
    min:
      storage: 1Gi
