apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-with-labels
  namespace: dev-team-alpha
  labels:
    environment: development
    team: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-with-labels
  template:
    metadata:
      labels:
        app: test-with-labels
        environment: development
        team: alpha
    spec:
      containers:
      - name: test-container
        image: nginx:1.20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
