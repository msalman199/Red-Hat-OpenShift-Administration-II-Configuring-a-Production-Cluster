apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-app
  namespace: dev-team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-app
  template:
    metadata:
      labels:
        app: insecure-app
    spec:
      containers:
      - name: insecure-container
        image: nginx:1.20
        securityContext:
          runAsUser: 0  # This violates restricted policy
          privileged: true  # This also violates restricted policy
        ports:
        - containerPort: 80
