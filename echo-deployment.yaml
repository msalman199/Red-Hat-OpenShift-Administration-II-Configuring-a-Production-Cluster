apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-mixed-app
  labels:
    app: echo-mixed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-mixed
  template:
    metadata:
      labels:
        app: echo-mixed
    spec:
      containers:
      - name: echo-server
        image: mendhak/tcp-udp-test:1
        ports:
        - containerPort: 2701
          protocol: TCP
        - containerPort: 2701
          protocol: UDP
        env:
        - name: TCP_PORT
          value: "2701"
        - name: UDP_PORT
          value: "2701"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
