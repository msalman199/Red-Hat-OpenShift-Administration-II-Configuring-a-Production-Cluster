apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scc-lab-binding
  namespace: scc-lab
subjects:
- kind: ServiceAccount
  name: privileged-sa
  namespace: scc-lab
- kind: ServiceAccount
  name: moderate-sa
  namespace: scc-lab
- kind: ServiceAccount
  name: restricted-sa
  namespace: scc-lab
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
